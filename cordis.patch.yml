# MAC 轻量：只跑 macOS 的轻量模式（无 PowerShell 行、无 plan mode、无 workflow）。
# 日常主力：读写文件 / glob·grep / bash + 后台任务 / 网页检索 / 技能 / Office / 子代理 / 上下文压缩。
- insert:
    - id: preset-mac-lite
      name: '@deepseek-ai/dsh-agent-preset'
      config:
        id: mac-lite
        name: MAC轻量
        description: macOS 日常轻量模式：文件读写、检索、bash 与后台任务、网页检索、技能、Office 文档、子代理，不做跨平台与重型编排。
        order: 5
        plugins:
          # 身份段只写本 preset 独有的部分：输出格式、思考、规划、工具选择这些
          # 通用纪律已经由 user-global AGENTS.md 经 agent-instructions 逐请求注入，
          # 这里再抄一遍等于每轮双倍 token，故刻意不重复。
          - id: persona
            name: '@deepseek-ai/dsh-persona'
            config:
              prefix: |-
                You are 小霞, a lightweight assistant for 王豪, an embedded software
                engineer working on macOS. Reply in Simplified Chinese, lead with the
                conclusion, and stay brief. Ground answers in real inspection rather
                than guesses; when genuinely uncertain, ask one short question.
                This preset targets macOS only: no PowerShell, no plan mode, and no
                workflow engine — prefer the built-in tools over heavy orchestration.
          - id: agent-instructions
            name: '@deepseek-ai/dsh-agent-instructions'
            config:
              maxBytes: 65536
          - id: time-context
            name: '@deepseek-ai/dsh-time-context'
          - id: tool-bash
            name: '@deepseek-ai/dsh-tool-bash'
            config:
              enableRunInBackground: true
          - id: tool-fs
            name: '@deepseek-ai/dsh-tool-fs'
            config:
              # 保持 false：edit 已覆盖改动场景，不额外注册 apply_patch。
              applyPatch: false
          - id: tool-fs-search
            name: '@deepseek-ai/dsh-tool-fs-search'
            config:
              sampleOverCapGlobResults: false
          - id: tool-jobs
            name: '@deepseek-ai/dsh-tool-jobs'
          - id: skill-filesystem
            name: '@deepseek-ai/dsh-skill-filesystem'
          - id: tool-skill
            name: '@deepseek-ai/dsh-tool-skill'
          # 上下文压缩：修剪器行必须由 preset 挂载（宿主 web 层已 disabled），
          # 其阈值即插件默认值，不再重复声明。
          - id: compaction
            name: cordis:group
            group: true
            isolate:
              compaction: true
              toolResultPruner: true
            config:
              - id: compaction-basic
                name: '@deepseek-ai/dsh-compaction-basic'
              - id: command-compact
                name: '@deepseek-ai/dsh-command-compact'
              - id: tool-result-pruner
                name: '@deepseek-ai/dsh-compaction-tool-result-pruner'
          - id: delegation
            name: cordis:group
            group: true
            config:
              # 轻量取向：不暴露 interrupt_agent，少一个工具就是少一份常驻提示词。
              - id: tool-subagent-control
                name: '@deepseek-ai/dsh-tool-subagent-control'
                config:
                  interrupt: false
              - id: tool-subagent
                name: '@deepseek-ai/dsh-tool-subagent'
                config:
                  provider: spawn
                  toolName: subagent
              - id: tool-subagent-fork
                name: '@deepseek-ai/dsh-tool-subagent'
                config:
                  provider: fork
                  toolName: subagent_fork
          - id: tool-ask-user
            name: '@deepseek-ai/dsh-tool-ask-user'
          - id: tool-todo
            name: '@deepseek-ai/dsh-tool-todo'
            config:
              allowParallelInProgress: true
          - id: tool-web
            name: '@deepseek-ai/dsh-tool-web'
            config:
              searchTimeoutMs: 60000
          - id: present
            name: '@deepseek-ai/dsh-tool-present'
          # 复用宿主已挂的 office-kit 与 office 技能：三个 office_* 工具只在
          # 加载 office 系技能后才进目录，空闲时零常驻开销。
          - id: tool-office
            name: '@deepseek-ai/dsh-tool-office'
          - id: tool-plugin-manager
            name: '@deepseek-ai/dsh-plugin-manager/tools'
            disabled: !!js "!ctx.get('profileContext')"
