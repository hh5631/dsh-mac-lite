# MAC 轻量：macOS 日常主力预设，含两个变体（同一份插件裁剪）：
#   mac-lite      原生执行器，逐工具直呼 —— 日常问答/改代码，首字最快
#   mac-lite-ptc  PTC 执行器，工具调用包进程序 —— 批量遍历/条件分支，省轮次
# 同一作用域只能挂一个执行器，所以必须分成两个 preset，不能塞进同一个。
- insert:
    - id: preset-mac-lite
      name: '@deepseek-ai/dsh-agent-preset'
      config:
        id: mac-lite
        name: MAC轻量
        description: macOS 日常轻量模式：文件读写、检索、bash 与后台任务、网页检索、技能、Office 文档、子代理。原生执行器，首字最快。
        order: 5
        plugins:
          - id: persona
            name: '@deepseek-ai/dsh-persona'
            config:
              prefix: |-
                You are 小霞, a lightweight assistant for 王豪, an embedded software
                engineer working on macOS. Reply in Simplified Chinese, lead with the
                conclusion, and stay brief. Ground answers in real inspection rather
                than guesses; when genuinely uncertain, ask one short question.
                This preset targets macOS only: no PowerShell, no plan mode, and no
                workflow engine — prefer the built-in tools over heavy orchestration.
          - id: agent-instructions
            name: '@deepseek-ai/dsh-agent-instructions'
            config:
              maxBytes: 65536
          - id: time-context
            name: '@deepseek-ai/dsh-time-context'
          # 保留一次性 bash：它带 run_in_background 与 job_* 配套。
          # 不用 persistent-bash —— 它与 tool-bash 争用同名 bash 工具，且没有后台任务；
          # 需要跨调用保留状态的场景用宿主已挂的 terminal_open/terminal_send。
          - id: tool-bash
            name: '@deepseek-ai/dsh-tool-bash'
            config:
              enableRunInBackground: true
          - id: tool-fs
            name: '@deepseek-ai/dsh-tool-fs'
            config:
              applyPatch: false
          - id: tool-fs-search
            name: '@deepseek-ai/dsh-tool-fs-search'
            config:
              sampleOverCapGlobResults: false
          - id: tool-jobs
            name: '@deepseek-ai/dsh-tool-jobs'
          - id: skill-filesystem
            name: '@deepseek-ai/dsh-skill-filesystem'
          - id: tool-skill
            name: '@deepseek-ai/dsh-tool-skill'
          - id: compaction
            name: cordis:group
            group: true
            isolate:
              compaction: true
              toolResultPruner: true
            config:
              - id: compaction-basic
                name: '@deepseek-ai/dsh-compaction-basic'
              - id: command-compact
                name: '@deepseek-ai/dsh-command-compact'
              - id: tool-result-pruner
                name: '@deepseek-ai/dsh-compaction-tool-result-pruner'
          - id: delegation
            name: cordis:group
            group: true
            config:
              - id: tool-subagent-control
                name: '@deepseek-ai/dsh-tool-subagent-control'
                config:
                  interrupt: false
              - id: tool-subagent
                name: '@deepseek-ai/dsh-tool-subagent'
                config:
                  provider: spawn
                  toolName: subagent
              - id: tool-subagent-fork
                name: '@deepseek-ai/dsh-tool-subagent'
                config:
                  provider: fork
                  toolName: subagent_fork
          - id: tool-ask-user
            name: '@deepseek-ai/dsh-tool-ask-user'
          - id: tool-todo
            name: '@deepseek-ai/dsh-tool-todo'
            config:
              allowParallelInProgress: true
          - id: tool-web
            name: '@deepseek-ai/dsh-tool-web'
            config:
              fetch: true
              searchTimeoutMs: 60000
          - id: present
            name: '@deepseek-ai/dsh-tool-present'
          - id: tool-office
            name: '@deepseek-ai/dsh-tool-office'
          - id: tool-plugin-manager
            name: '@deepseek-ai/dsh-plugin-manager/tools'
            disabled: !!js "!ctx.get('profileContext')"
    - id: preset-mac-lite-ptc
      name: '@deepseek-ai/dsh-agent-preset'
      config:
        id: mac-lite-ptc
        name: MAC轻量·PTC
        description: 与 MAC轻量同源，改用 PTC 执行器：工具调用写成程序，批量遍历/条件分支只花一轮。简单任务比原生版慢。
        order: 6
        plugins:
          - id: persona
            name: '@deepseek-ai/dsh-persona'
            config:
              prefix: |-
                You are 小霞, a lightweight assistant for 王豪, an embedded software
                engineer working on macOS. Reply in Simplified Chinese, lead with the
                conclusion, and stay brief. Ground answers in real inspection rather
                than guesses; when genuinely uncertain, ask one short question.
                This preset targets macOS only: no PowerShell, no plan mode, and no
                workflow engine — prefer the built-in tools over heavy orchestration.
          - id: agent-instructions
            name: '@deepseek-ai/dsh-agent-instructions'
            config:
              maxBytes: 65536
          - id: time-context
            name: '@deepseek-ai/dsh-time-context'
          # 保留一次性 bash：它带 run_in_background 与 job_* 配套。
          # 不用 persistent-bash —— 它与 tool-bash 争用同名 bash 工具，且没有后台任务；
          # 需要跨调用保留状态的场景用宿主已挂的 terminal_open/terminal_send。
          - id: tool-bash
            name: '@deepseek-ai/dsh-tool-bash'
            config:
              enableRunInBackground: true
          - id: tool-fs
            name: '@deepseek-ai/dsh-tool-fs'
            config:
              applyPatch: false
          - id: tool-fs-search
            name: '@deepseek-ai/dsh-tool-fs-search'
            config:
              sampleOverCapGlobResults: false
          - id: tool-jobs
            name: '@deepseek-ai/dsh-tool-jobs'
          - id: skill-filesystem
            name: '@deepseek-ai/dsh-skill-filesystem'
          - id: tool-skill
            name: '@deepseek-ai/dsh-tool-skill'
          - id: compaction
            name: cordis:group
            group: true
            isolate:
              compaction: true
              toolResultPruner: true
            config:
              - id: compaction-basic
                name: '@deepseek-ai/dsh-compaction-basic'
              - id: command-compact
                name: '@deepseek-ai/dsh-command-compact'
              - id: tool-result-pruner
                name: '@deepseek-ai/dsh-compaction-tool-result-pruner'
          - id: delegation
            name: cordis:group
            group: true
            config:
              - id: tool-subagent-control
                name: '@deepseek-ai/dsh-tool-subagent-control'
                config:
                  interrupt: false
              - id: tool-subagent
                name: '@deepseek-ai/dsh-tool-subagent'
                config:
                  provider: spawn
                  toolName: subagent
              - id: tool-subagent-fork
                name: '@deepseek-ai/dsh-tool-subagent'
                config:
                  provider: fork
                  toolName: subagent_fork
          - id: tool-ask-user
            name: '@deepseek-ai/dsh-tool-ask-user'
          - id: tool-todo
            name: '@deepseek-ai/dsh-tool-todo'
            config:
              allowParallelInProgress: true
          - id: tool-web
            name: '@deepseek-ai/dsh-tool-web'
            config:
              fetch: true
              searchTimeoutMs: 60000
          - id: present
            name: '@deepseek-ai/dsh-tool-present'
          - id: tool-office
            name: '@deepseek-ai/dsh-tool-office'
          - id: tool-plugin-manager
            name: '@deepseek-ai/dsh-plugin-manager/tools'
            disabled: !!js "!ctx.get('profileContext')"
          # PTC：把工具调用包进 run_code 程序，适合批量遍历/条件分支。
          # 注意：同一作用域只能有一个执行器，故单独成 preset。
          - id: tool-executor-ptc
            name: '@deepseek-ai/dsh-tool-executor-ptc'
            config:
              maxParallelSubCalls: 10
              maxSubCallsPerMinute: 1024
